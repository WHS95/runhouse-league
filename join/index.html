<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>크루 초대 · 런하우스 리그</title>
<meta property="og:url" content="https://whs95.github.io/runhouse-league/join/">
<meta property="og:title" content="런하우스 리그 크루에 초대받았어요">
<meta property="og:description" content="초대 코드를 넣으면 바로 크루원이 돼요. 런하우스 리그 — 러닝 크루 리그">
<meta property="og:image" content="https://whs95.github.io/runhouse-league/og/join.png?v=1">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:site_name" content="런하우스 리그">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="초대 코드를 넣으면 바로 크루원이 돼요. 런하우스 리그 — 러닝 크루 리그">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Noto Sans KR",-apple-system,sans-serif;color:#171719;background:radial-gradient(120% 90% at 0% 0%,#F1FBC8 0%,#DAF287 45%,#CFEF68 65%,#B8EFC9 100%)}
main{max-width:480px;margin:0 auto;padding:56px 20px 40px;min-height:100vh;display:flex;flex-direction:column}
.mark{width:56px;height:14px;margin-bottom:20px}
.kick{font-weight:700;font-size:15px;opacity:.75}
h1{font-size:30px;line-height:1.3;font-weight:800;margin:6px 0 18px;letter-spacing:-.5px}
.box{background:rgba(255,255,255,.65);border-radius:20px;padding:18px 20px;display:flex;align-items:center;gap:12px}
.box small{display:block;font-size:13px;font-weight:700;opacity:.6}
.code{font-size:30px;font-weight:800;letter-spacing:1px}
.copy{margin-left:auto;background:#171719;color:#D6F26A;border:0;border-radius:12px;padding:10px 14px;font:700 14px "Noto Sans KR",sans-serif}
p{font-size:16px;line-height:1.65;margin:18px 0}
.sp{flex:1}
.btn{display:block;text-align:center;text-decoration:none;border-radius:16px;padding:17px;font-weight:800;font-size:17px;margin-top:10px}
.pri{background:#171719;color:#fff}.sec{border:1.5px solid rgba(23,23,25,.35);color:#171719;background:rgba(255,255,255,.35)}
.note{font-size:13px;opacity:.6;text-align:center;margin-top:14px}
</style></head><body><main>
<svg class="mark" viewBox="0 0 110 24"><path d="M4 20 L100 6 L100 16" fill="none" stroke="#171719" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div class="kick">크루 초대</div>
<h1 id="t">런하우스 리그 크루에<br>초대받았어요</h1>
<div class="box" id="cb"><div><small>초대 코드</small><div class="code" id="c">—</div></div><button class="copy" id="cp" type="button">복사하기</button></div>
<p id="d">앱을 설치하고 크루 찾기에서 초대 코드를 넣으면 바로 크루원이 돼요.</p>
<div class="sp"></div>
<a class="btn pri" id="inst" href="https://apps.apple.com/kr/app/id6808215626">앱 설치하고 들어가기</a>
<a class="btn sec" id="open" href="runhouse://crew/join">이미 앱이 있어요 · 앱에서 열기</a>
<div class="note">런하우스 리그 — 러닝 크루 리그</div>
</main>
<script>
(function(){
  var ua=navigator.userAgent;var store=/android/i.test(ua)?"https://play.google.com/store/apps/details?id=com.runhouse.app":"https://apps.apple.com/kr/app/id6808215626";
  var q=new URLSearchParams(location.search);
  // 코드는 RH-XXXX 또는 옛 8자. 모양이 아니면 보여 주지 않는다(주소로 아무 글이나 띄우지 않게).
  var code=(q.get("code")||"").trim().toUpperCase();
  var ok=/^(RH-[A-Z0-9]{4}|[A-Z0-9]{8})$/.test(code);
  var name=(q.get("n")||"").trim().slice(0,20);
  var inst=document.getElementById("inst"), open=document.getElementById("open");
  inst.href=store;
  if(!ok){
    document.getElementById("t").textContent="초대 코드를 찾지 못했어요";
    document.getElementById("cb").style.display="none";
    document.getElementById("d").textContent="받은 링크가 잘렸을 수 있어요. 크루에 다시 요청해 주세요. 앱에서는 크루 찾기로 크루를 둘러볼 수 있어요.";
    open.href="runhouse://";
    return;
  }
  document.getElementById("c").textContent=code;
  if(name){ var t=document.getElementById("t"); t.textContent=""; t.appendChild(document.createTextNode("「"+name+"」 크루에")); t.appendChild(document.createElement("br")); t.appendChild(document.createTextNode("초대받았어요")); document.title=name+" 크루 초대 · 런하우스 리그"; }
  open.href="runhouse://crew/join?code="+encodeURIComponent(code);
  document.getElementById("cp").onclick=function(){
    var b=this; (navigator.clipboard?navigator.clipboard.writeText(code):Promise.reject()).then(function(){b.textContent="복사했어요";},function(){b.textContent="길게 눌러 복사해 주세요";});
  };
})();
</script>
</body></html>
